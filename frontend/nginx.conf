server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Matches the gateway's photo-upload cap; nginx would otherwise reject anything
    # over its 1 MB default before the request reaches the API.
    client_max_body_size 26m;

    location /api/ {
        proxy_pass http://backend-go:18080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The gateway rate limits per client, so it needs the real caller address.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
