name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    name: Go gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  svg-engine:
    name: Rust SVG engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend-rust
      - run: cargo build --release --locked

  studio:
    name: React studio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  ml-worker:
    name: ML worker helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The SVG extraction helpers are pure stdlib; app.py only needs the web stack
      # to import. torch/transformers/diffusers are optional at import time, so the
      # suite runs in seconds without model weights.
      - run: pip install --disable-pip-version-check fastapi==0.115.5 pydantic==2.10.2 pillow
      - run: python -m unittest discover -s tests -t .
        working-directory: ml-worker
