[package]
name = "svgml-rust-engine"
version = "0.1.0"
edition = "2021"
description = "High-performance color vectorization (vtracer) and SVG color/path processing service"

[dependencies]
axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vtracer = "0.6"
visioncortex = "0.8"
image = "0.24"
base64 = "0.22"
regex = "1.10"
roxmltree = "0.20"
anyhow = "1.0"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
